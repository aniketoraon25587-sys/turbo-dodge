<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbo Dodge</title>
<style>
:root{--bg:#f3f1ec;--fg:#1d1d1f;--card:#fff;--accent:#e63946;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#f2f2f2;--card:#22242a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#f2f2f2;--card:#22242a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:20px;letter-spacing:.5px}
#hud{display:flex;gap:18px;font-size:15px;font-variant-numeric:tabular-nums}
#wrap{position:relative;width:min(92vw,360px);aspect-ratio:3/5;max-height:70vh}
canvas{width:100%;height:100%;border-radius:14px;background:#2b2d33;display:block}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:16px}
#msg b{font-size:26px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:16px;font-weight:600}
#pad{display:flex;gap:12px;width:min(92vw,360px)}
#pad button{flex:1;background:var(--card);color:var(--fg);font-size:22px;padding:14px;border:1px solid rgba(128,128,128,.3)}
</style>
</head>
<body>
<h1>🏎️ Turbo Dodge</h1>
<div id="hud"><span>Score: <b id="s">0</b></span><span>Best: <b id="b">0</b></span><span>Speed: <b id="v">0</b></span></div>
<div id="wrap">
<canvas id="c" width="360" height="600"></canvas>
<div id="msg"><b>Turbo Dodge</b><span>Steer with ← → keys, the buttons below, or tap/swipe the road.<br>Hold 🔥 NITRO (or ↑) for double points.<br>Pass close to traffic for combo bonuses!</span><button id="go">Start</button></div>
</div>
<div id="pad"><button id="L">◀</button><button id="N" style="font-size:15px;color:#ff9f1c">🔥 NITRO</button><button id="R">▶</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=600,LANES=4,LW=W/LANES;
const $=id=>document.getElementById(id),msg=$('msg');
function AC(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();return ac}
function beep(f,d,ty){try{const a=AC(),o=a.createOscillator(),g=a.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function engine(on){try{if(on&&!eo){const a=AC(),g=a.createGain(),f=a.createBiquadFilter(),o1=a.createOscillator(),o2=a.createOscillator(),l=a.createOscillator(),lg=a.createGain();o1.type='sawtooth';o2.type='square';f.type='lowpass';g.gain.value=.05;l.frequency.value=24;lg.gain.value=.012;l.connect(lg);lg.connect(g.gain);o1.connect(f);o2.connect(f);f.connect(g);g.connect(a.destination);[o1,o2,l].forEach(o=>o.start());eo={o1,o2,f,l}}if(!on&&eo){[eo.o1,eo.o2,eo.l].forEach(o=>o.stop());eo=null}}catch(e){}}
function rev(){if(!eo)return;const v=speed*20,gear=Math.min(5,v/55|0),rpm=Math.min(1,(v-gear*55)/55),f=40+rpm*65+gear*7,n=ac.currentTime;eo.o1.frequency.setTargetAtTime(f,n,.04);eo.o2.frequency.setTargetAtTime(f*1.5,n,.04);eo.f.frequency.setTargetAtTime(280+rpm*800+(boost?700:0),n,.05)}
function noise(d,fr,vol,ty){try{const a=AC(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type=ty||'bandpass';fl.frequency.value=fr;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()}catch(e){}}
let best=0;try{best=+localStorage.getItem('td_best')||0}catch(e){}
$('b').textContent=best;
let lane,px,cars,coins=[],got=0,score,speed,off,t,spawn,run=false,eo,ac,boost=false,nitro=100,combo=0,ct=0;
const cols=['#3a86ff','#ffbe0b','#8338ec','#06d6a0','#fb5607'];
function reset(){lane=1;px=lane*LW+LW/2;cars=[];coins=[];got=0;score=0;nitro=100;boost=false;combo=0;ct=0;speed=4;off=0;t=0;spawn=0}
const T={sedan:{w:36,h:64},suv:{w:40,h:72},van:{w:40,h:84},truck:{w:42,h:130},bus:{w:44,h:120},moto:{w:14,h:42},pickup:{w:40,h:76},police:{w:36,h:66},amb:{w:42,h:86}};
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function car(cx,cy,c,p,k='sedan'){const{w,h}=T[k],hw=w/2,hh=h/2;x.save();x.translate(cx,cy);
x.fillStyle='rgba(0,0,0,.3)';rr(-hw+3,-hh+4,w,h,6);x.fillStyle='#111';
if(k=='moto'){x.fillRect(-2,-hh,4,10);x.fillRect(-2,hh-12,4,12);x.fillStyle=c;rr(-5,-10,10,22,4);x.fillStyle='#222';x.beginPath();x.arc(0,-2,5,0,7);x.fill();x.fillStyle='#fff6c8';x.fillRect(-4,-hh+8,8,2);x.restore();return}
const wy=(k=='truck'||k=='bus')?[-hh+16,hh-40,hh-24]:[-hh+10,hh-24];
wy.forEach(y=>{x.fillRect(-hw-3,y,5,16);x.fillRect(hw-2,y,5,16)});
x.fillStyle=c;
if(k=='truck'){rr(-hw,-hh,w,34,6);x.fillStyle='#e8e8e8';rr(-hw+1,-hh+38,w-2,h-38,3);x.fillStyle='rgba(0,0,0,.12)';x.fillRect(-1,-hh+38,2,h-38);x.fillStyle='#9fd3ff';rr(-hw+4,-hh+6,w-8,10,3)}
else if(k=='bus'){rr(-hw,-hh,w,h,7);x.fillStyle='#9fd3ff';rr(-hw+4,-hh+5,w-8,10,3);for(let y=-hh+22;y<hh-12;y+=16){rr(-hw+4,y,8,11,2);rr(hw-12,y,8,11,2)}}
else{rr(-hw,-hh,w,h,10);x.fillStyle='rgba(20,30,45,.75)';rr(-hw+4,-hh+(k=='van'?4:14),w-8,k=='van'?14:16,4);if(k!='van')rr(-hw+4,hh-24,w-8,12,4);x.fillStyle='rgba(255,255,255,.18)';rr(-hw+4,-hh+(k=='van'?20:32),w-8,k=='van'?h-34:h-60,4)}
const fl=(t>>3)&1;
if(k=='pickup'){x.fillStyle='rgba(0,0,0,.35)';rr(-hw+4,hh-38,w-8,32,2)}
if(k=='police'){x.fillStyle='#fff';x.fillRect(-hw,-2,w,12);x.fillStyle=fl?'#ff2d2d':'#2d6bff';x.fillRect(-10,-6,9,5);x.fillStyle=fl?'#2d6bff':'#ff2d2d';x.fillRect(1,-6,9,5)}
if(k=='amb'){x.fillStyle='#d00';x.fillRect(-hw,2,w,6);x.fillStyle=fl?'#ff2d2d':'#fff';x.fillRect(-12,-10,10,5);x.fillStyle=fl?'#fff':'#ff2d2d';x.fillRect(2,-10,10,5)}
x.fillStyle='#fff6c8';x.fillRect(-hw+3,-hh,6,3);x.fillRect(hw-9,-hh,6,3);
x.fillStyle='#d00';x.fillRect(-hw+3,hh-3,6,3);x.fillRect(hw-9,hh-3,6,3);
if(p){x.fillStyle='#fff';x.fillRect(-2,-hh+2,4,h-4)}
x.restore()}
function move(d){if(!run)return;const n=Math.max(0,Math.min(LANES-1,lane+d));if(n!=lane)noise(.18,2200,.06);lane=n}
function loop(){
 if(run){
  t++;boost=boost&&nitro>0;speed=4+Math.min(10,score/400)+(boost?4:0);nitro=boost?nitro-.8:Math.min(100,nitro+.12);if(ct>0&&--ct==0)combo=0;off=(off+speed)%80;score+=speed/10*(boost?2:1);
  px+=(lane*LW+LW/2-px)*.25;
  if(--spawn<=0){const l=Math.floor(Math.random()*LANES);if(!cars.some(c=>c.y<170&&c.l==l)){const r=Math.random(),k=r<.28?'sedan':r<.4?'suv':r<.5?'van':r<.6?'pickup':r<.7?'truck':r<.77?'bus':r<.84?'moto':r<.92?'police':'amb';cars.push({l,k,y:-80,c:k=='bus'?'#f4b400':k=='police'?'#1d2a44':k=='amb'?'#f5f5f5':cols[Math.random()*5|0],s:speed*((k=='truck'||k=='bus')?.7:k=='moto'?.3:.5+Math.random()*.3)})}spawn=Math.max(18,60-score/30)}
  cars.forEach(c=>c.y+=speed-c.s*.4);
  cars=cars.filter(c=>c.y<H+80);
  if(t%60==0){const l=Math.random()*LANES|0;if(!cars.some(c=>c.l==l&&c.y<200))coins.push({l,y:-20})}
  cars.forEach(c=>{if(!c.p&&c.y>H-90+(T[c.k].h+64)/2){c.p=1;if(Math.abs(c.l*LW+LW/2-px)<LW*1.1){combo++;ct=240;score+=10*combo;beep(520+combo*40,.1)}}});
  coins.forEach(o=>o.y+=speed);
  coins=coins.filter(o=>{if(Math.abs(o.l*LW+LW/2-px)<30&&Math.abs(o.y-(H-90))<45){got++;score+=25;beep(880,.08);return false}return o.y<H+20});
  for(const c of cars){if(Math.abs(c.l*LW+LW/2-px)<(T[c.k].w+32)/2&&Math.abs(c.y-(H-90))<(T[c.k].h+64)/2){crash();break}}
  $('s').textContent=score|0;$('v').textContent=(speed*20|0)+' km/h · 🪙'+got;if(eo)rev();$('v').textContent+=(combo>1?' · x'+combo:'');
 }
 x.fillStyle='#2b2d33';x.fillRect(0,0,W,H);
 x.fillStyle='#4a4d55';x.fillRect(0,0,6,H);x.fillRect(W-6,0,6,H);
 x.fillStyle='#d9d9d9';
 for(let i=1;i<LANES;i++)for(let y=-80+off;y<H;y+=80)x.fillRect(i*LW-2,y,4,40);
 x.fillStyle='rgba(255,255,255,.2)';x.fillRect(12,12,100,8);x.fillStyle=boost?'#ff9f1c':'#2ec4b6';x.fillRect(12,12,Math.max(0,nitro),8);x.fillStyle='#fff';x.font='10px sans-serif';x.textAlign='left';x.fillText('NITRO',12,32);
 if(boost){x.fillStyle='rgba(255,255,255,.3)';for(let i=0;i<8;i++)x.fillRect(Math.random()*W,Math.random()*H,2,40)}
 coins.forEach(o=>{const cx=o.l*LW+LW/2;x.fillStyle='#ffd23f';x.beginPath();x.arc(cx,o.y,10,0,7);x.fill();x.fillStyle='#b88600';x.font='bold 12px sans-serif';x.textAlign='center';x.fillText('$',cx,o.y+4)});
 cars.forEach(c=>car(c.l*LW+LW/2,c.y,c.c,false,c.k));
 car(px,H-90,'#e63946',true);
 requestAnimationFrame(loop)}
function crash(){run=false;engine(false);noise(.8,500,.5,'lowpass');beep(90,.4,'sawtooth');if(score>best){best=score|0;try{localStorage.setItem('td_best',best)}catch(e){}$('b').textContent=best}
 msg.innerHTML='<b>Crash! 💥</b><span>Score: '+(score|0)+'</span>';const b=document.createElement('button');b.textContent='Play again';b.onclick=start;msg.appendChild(b);msg.style.display='flex'}
function start(){reset();run=true;engine(true);msg.style.display='none'}
$('go').onclick=start;
$('L').onpointerdown=()=>move(-1);$('R').onpointerdown=()=>move(1);
$('N').onpointerdown=()=>{if(run&&nitro>20){boost=true;noise(.5,900,.1)}};$('N').onpointerup=$('N').onpointerleave=()=>{boost=false};
addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key=='a')move(-1);if(e.key=='ArrowRight'||e.key=='d')move(1);if(e.key==' '&&!run)start();if((e.key=='ArrowUp'||e.key=='w')&&run&&nitro>20&&!boost){boost=true;noise(.5,900,.1)}});addEventListener('keyup',e=>{if(e.key=='ArrowUp'||e.key=='w')boost=false});
let sx=null;
cv.addEventListener('pointerdown',e=>{sx=e.clientX});
cv.addEventListener('pointerup',e=>{if(sx===null)return;const d=e.clientX-sx;if(Math.abs(d)>25)move(d>0?1:-1);else{const r=cv.getBoundingClientRect();move(e.clientX<r.left+r.width/2?-1:1)}sx=null});
reset();loop();
</script>
</body>
</html>
